[build-system]
# torch is a build requirement: the extension links libtorch, located via the
# installed torch package's CMake prefix (src/core/python/CMakeLists.txt).
requires = ["scikit-build-core>=0.10", "nanobind>=2.0.0", "torch>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "resolve-core"
version = "1.0.2"
description = "RESOLVE C++ engine: predict sample outcomes from compositional data via learned representations"
readme = "python/README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Gilles Colling", email = "gilles.colling051@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    # The extension links libtorch and imports torch before loading; the wheels
    # do not bundle libtorch, so torch must be installed at runtime.
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/gcol33/resolve"
Repository = "https://github.com/gcol33/resolve"

[tool.scikit-build]
# The project root is src/core, so the sdist carries the engine sources the
# extension compiles (cpp_src/, include/, cuda/, the resolve_*.cmake lists) next
# to the bindings; CMake configures from python/.
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
cmake.build-type = "Release"
cmake.source-dir = "python"
wheel.packages = ["python/src/resolve_core"]
sdist.exclude = [
    "/build*/",
    "/cli/",
    "/tests/",
    "/dev_notes/",
    "/CMakeLists.txt",
    "/cuda_toolchain.cmake",
    "__pycache__/",
    "*.pyd",
    "*.so",
    "*.dll",
    "*.lib",
]
