  - articles/encoding
  - articles/training
  - articles/prediction
  - articles/fine-tuning
  - articles/species-names
  - articles/gap-fitting
  - articles/terrain-correction
  - articles/embeddings
- title: Scaling up
  navbar: Scaling up
  contents:
  - articles/performance
  - articles/command-line
- title: Setup
  navbar: Setup
  contents: articles/installation
- title: internal
  contents: articles/app
- title: Python reference
  desc: |
    The Python package's classes and functions, grouped as the R reference is.
  navbar: ~
  contents:
  - articles/python-reference
  - articles/python-data
  - articles/python-training
  - articles/python-prediction
  - articles/python-suites
  - articles/python-fine-tuning
  - articles/python-gap-fitting
  - articles/python-terrain-correction
  - articles/python-names
  - articles/python-scoring
  - articles/python-engine
