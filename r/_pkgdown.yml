reference:
- title: Loading data
  desc: |
    Plots and the species records observed in them, from CSV files or data frames, into a RESOLVE engine dataset.
  contents:
  - resolve.dataset.csv
  - resolve.dataset.frame
  - resolve.species_graph
- title: Training
  desc: |
    Fitting a model, cross-validating it and pretraining its encoder without labels.
  contents:
  - resolve.train.dataset
  - resolve.cross_validate
  - resolve.pretrain_vae
  - resolve.default_config
  - resolve.progress
- title: Saving and imputing
  desc: |
    Checkpoints, what they record about the run, and imputed values for new plots.
  contents:
  - resolve.save
  - resolve.load
  - resolve.load_train_config
  - resolve.load_run_metadata
  - resolve.predict.dataset
  - resolve.nearest_by_cosine
  - resolve.retrieval
  - resolve.plot_totals
- title: Model suites
  desc: |
    Several trained models released as one directory and scored together.
  contents:
  - resolve.load_suite
  - resolve.verify_suite
  - resolve.seal_suite
  - resolve.predict.suite
  - as.data.frame.resolve_suite_predictions
- title: Fine-tuning
  desc: |
    New heads for your own targets on the encoder of a trained model or a suite member, and the fine-tuned models released as a suite.
  contents:
  - resolve.parent
  - resolve.derive_suite
- title: Gap fitting
  desc: |
    Imputing a dataset's missing values from its own complete plots, beside the raw imputed value.
  contents:
  - resolve.fit_gaps
  - resolve.fit_prediction_gaps
- title: Terrain correction
  desc: |
    Altitude and slope combined with an elevation model read at the plots, and the compressed elevation model a suite ships.
  contents:
  - resolve.terrain_descriptors
  - resolve.terrain_grid
  - resolve.fit_terrain_correction
  - resolve.terrain_correction
  - resolve.encode_terrain_grids
  - resolve.fit_terrain_tile
- title: Scoring
  desc: |
    The metrics training reports, for values imputed anywhere.
  contents: resolve_metrics
- title: Name matching
  desc: |
    Species names read as the names a model learnt, and the entries of a list of names within a few edits of a query.
  contents:
  - resolve.names
  - resolve.fuzzy_index
  - resolve.fuzzy_match
- title: The RESOLVE engine
  desc: |
    Installing the RESOLVE engine library, checking which one is loaded, seeding its random numbers, and the GPU memory settings.
  contents:
  - resolve.install_backend
  - resolve.available
  - resolve.version
  - resolve.manual_seed
  - resolve.set_vram_fraction
  - resolve_configure_cuda_allocator
