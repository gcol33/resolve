url: https://gillescolling.com/resolve/r/
destination: docs

template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: true

figures:
  dev: svg
  fig.ext: svg
  bg: "#F5F6F8"

home:
  title: "resolveR: Predicting Sample Outcomes from Compositional Data"
  description: >
    R client for the RESOLVE C++ engine. It calls the engine through its C ABI
    (the resolve_c shared library, fetched by resolve.install_backend()) to
    load compositional data, train multi-task models on a learned
    representation of each sample's composition, and predict with single
    models or released model suites.

authors:
  Gilles Colling:
    href: https://github.com/gcol33

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, lightswitch, github]
  components:
    intro:
      text: Get Started
      href: articles/getting-started.html
    articles:
      text: Articles
      menu:
        - text: "Getting Started with RESOLVE"
          href: articles/getting-started.html
    github:
      icon: fab fa-github
      href: https://github.com/gcol33/resolve
      aria-label: GitHub

reference:
  - title: "Backend"
    desc: "Install and inspect the resolve_c engine library the package calls."
    contents:
      - resolve.install_backend
      - resolve.available
      - resolve.version
      - resolve.set_vram_fraction
  - title: "Data"
    desc: "Load plots and their species records into an engine dataset."
    contents:
      - resolve.dataset.csv
      - resolve.dataset.frame
      - resolve.species_graph
  - title: "Training"
    desc: "Fit a model and follow its progress."
    contents:
      - resolve.train.dataset
      - resolve.cross_validate
      - resolve.pretrain_vae
      - resolve.default_config
      - resolve.progress
  - title: "Models"
    desc: "Save, load and inspect trained checkpoints."
    contents:
      - resolve.save
      - resolve.load
      - resolve.load_train_config
      - resolve.load_run_metadata
  - title: "Prediction"
    desc: "Predict targets for new plots."
    contents:
      - resolve.predict.dataset
      - resolve.retrieval
  - title: "Model suites"
    desc: "Released sets of models scored as one."
    contents:
      - resolve.load_suite
      - resolve.verify_suite
      - resolve.seal_suite
      - resolve.predict.suite
      - as.data.frame.resolve_suite_predictions
  - title: "Name matching"
    desc: "Find the entries of a list of names within a few edits of a query."
    contents:
      - resolve.fuzzy_index
      - resolve.fuzzy_match
  - title: "Metrics"
    desc: "Score predictions against observed values."
    contents:
      - resolve_metrics

footer:
  structure:
    left: developed_by
    right: built_with
