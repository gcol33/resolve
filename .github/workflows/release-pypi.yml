name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to TestPyPI instead of PyPI'
        type: boolean
        default: true
      publish:
        description: 'Publish at all (off = build only, for iterating on the wheels)'
        type: boolean
        default: false

env:
  CIBW_BUILD_VERBOSITY: 1

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is arm64 only: PyPI carries no macOS x86_64 torch wheel past
        # 2.2.2, and this package requires torch>=2.0 at runtime, so an Intel
        # wheel would install and then fail to import for want of its libtorch.
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      # The extension links libtorch located via the installed `torch` package
      # (src/core/python/CMakeLists.txt), so no standalone libtorch is
      # downloaded. CPU torch is installed in the build env (the default PyPI
      # torch on Linux/Windows is the CUDA build); the wheel does NOT bundle
      # libtorch -- it links the same libs the user's torch ships, and the
      # repair step excludes them so the wheel stays small.
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: src/core/python
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux* *-manylinux_i686 pp*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_MACOS: native
          # manylinux_2_28 rather than the manylinux2014 default: numpy and
          # torch no longer publish manylinux2014 wheels, so the test env
          # resolved numpy to its sdist and tried to compile it with the 2014
          # image's gcc 10.2.1, under the gcc >= 10.3 that numpy requires.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
          # Install CPU torch + the build backend, then build without isolation
          # so the build sees the CPU torch. macOS torch is CPU-only on PyPI; the
          # explicit cpu index is for Linux/Windows where PyPI torch is CUDA.
          # `python -m pip` (not bare `pip`) for the self-upgrade: on Windows
          # `pip install --upgrade pip` aborts ("To modify pip, please run
          # python -m pip ..."), which killed the whole chain. cmake + ninja are
          # installed explicitly because the build runs with --no-isolation and
          # scikit-build-core's get_requires_for_build_wheel asks for ninja>=1.5,
          # which the manylinux container does not ship (Linux failed there).
          CIBW_BEFORE_BUILD_LINUX: >
            python -m pip install --upgrade pip &&
            pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu &&
            pip install "scikit-build-core>=0.4.3" "nanobind>=2.0.0" cmake ninja
          CIBW_BEFORE_BUILD_WINDOWS: >
            python -m pip install --upgrade pip &&
            pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu &&
            pip install "scikit-build-core>=0.4.3" "nanobind>=2.0.0" delvewheel cmake ninja
          CIBW_BEFORE_BUILD_MACOS: >
            python -m pip install --upgrade pip &&
            pip install "torch>=2.0" &&
            pip install "scikit-build-core>=0.4.3" "nanobind>=2.0.0" cmake ninja
          # Do not bundle libtorch: exclude torch's shared libs from the repair.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair
            --exclude libtorch.so --exclude libtorch_cpu.so
            --exclude libtorch_python.so --exclude libc10.so
            --exclude libgomp.so.1
            -w {dest_dir} {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            delocate-wheel --ignore-missing-dependencies --require-archs {delocate_archs}
            --exclude libtorch --exclude libtorch_cpu --exclude libtorch_python
            --exclude libc10 --exclude libomp
            -w {dest_dir} -v {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
            delvewheel repair
            --exclude c10.dll --exclude torch_cpu.dll --exclude torch_python.dll
            --exclude fbgemm.dll --exclude asmjit.dll --exclude libiomp5md.dll
            --exclude uv.dll --exclude shm.dll
            -w {dest_dir} {wheel}
          # Importing the wheel needs torch in the test env; verify it imports.
          CIBW_TEST_REQUIRES: "torch>=2.0"
          CIBW_TEST_COMMAND: "python -c \"import resolve_core; print(resolve_core.__version__)\""

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: |
          cd src/core/python
          pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: src/core/python/dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    # Publish on a real release, or on a manual dispatch that opts in.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    environment:
      name: pypi
      url: https://pypi.org/p/resolve-core
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.test_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.test_pypi)
        uses: pypa/gh-action-pypi-publish@release/v1
