name: Deploy Docs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# The site under docs/ is built locally, by r/build_site.R, because its articles run against the
# engine and the build post-processes the figures. This workflow publishes the committed build,
# after checking that it is the one the sources render to: build_site.R writes a digest of every
# source the site is rendered from into docs/, and a push whose sources digest to something else
# fails here until the site is rebuilt and committed with them.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Compare the committed site's digest with the sources
        working-directory: r
        run: Rscript tools/site_digest.R --check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
