name: Deploy Docs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # mkdocs 2 drops the plugin and theme system Material for MkDocs is
      # built on.
      - name: Install dependencies
        run: |
          pip install "mkdocs>=1.6,<2" mkdocs-material pymdown-extensions

      # The R package's pkgdown reference is published under the MkDocs site
      # at r/. Building it needs the package's R dependencies, not the engine:
      # its examples and vignette code are not run.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::pkgdown, local::.
          needs: website

      # --strict fails the build on any MkDocs warning (a broken link, a page
      # missing from the nav); --r adds the pkgdown site at site/r/.
      - name: Build docs
        run: python build_docs.py --r

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
