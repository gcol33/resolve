name: R-CMD-check

on:
  push:
    branches: [main, master]
    paths:
      - 'r/**'
      - 'src/core/**'
      - '.github/workflows/r-cmd-check.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'r/**'
      - 'src/core/**'
  workflow_dispatch:

# Issue #17: the R package is a thin client over the prebuilt `resolve_c` C ABI
# shared library; it never compiles the engine or links libtorch directly. Every
# platform builds resolve_c the same way (CPU libtorch, OpenMP off) and links
# it -- a single C-client path, including Windows, where mingw consumes the
# MSVC-built import library. This is the acceptance test for the issue: a green
# Windows R-CMD-check.
jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      # Run the heavy (skip_on_cran) tests, but skip the remote CRAN
      # incoming-feasibility check (a network name-conflict probe vs
      # Bioconductor's RESOLVE, unrelated to build correctness).
      _R_CHECK_CRAN_INCOMING_REMOTE_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # ---- libtorch (CPU) -------------------------------------------------
      - name: Download libtorch (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wget -q https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-2.6.0%2Bcpu.zip
          unzip -q libtorch-cxx11-abi-shared-with-deps-2.6.0+cpu.zip
          echo "LIBTORCH=${{ github.workspace }}/libtorch" >> $GITHUB_ENV

      - name: Download libtorch (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          wget -q https://download.pytorch.org/libtorch/cpu/libtorch-macos-arm64-2.6.0.zip
          unzip -q libtorch-macos-arm64-2.6.0.zip
          echo "LIBTORCH=${{ github.workspace }}/libtorch" >> $GITHUB_ENV

      - name: Download libtorch (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o libtorch.zip https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-2.6.0%2Bcpu.zip
          7z x -y libtorch.zip > /dev/null
          echo "LIBTORCH=${{ github.workspace }}/libtorch" >> $GITHUB_ENV

      # ---- build the resolve_c C ABI shared library -----------------------
      # Same flags on every platform: CPU libtorch, OpenMP off, only the
      # resolve_c target. The R bindings never call fuzzy::query_batch (the only
      # OpenMP user), and a CUDA/OpenMP-heavy DLL is unstable inside the R
      # process -- see dev_notes/issue17_c_abi_facade_design.md.
      - name: Build resolve_c (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S src/core -B build_c \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON=OFF -DBUILD_CLI=OFF -DBUILD_TESTS=OFF \
            -DBUILD_R_CAPI=ON -DUSE_CUDA=OFF -DRESOLVE_USE_OPENMP=OFF \
            -DTorch_DIR="$LIBTORCH/share/cmake/Torch"
          cmake --build build_c --target resolve_c --parallel 2
          echo "RESOLVE_C_HOME=${{ github.workspace }}/build_c" >> $GITHUB_ENV

      # Windows builds with Ninja + the MSVC toolchain set up by msvc-dev-cmd
      # (version-agnostic: works on whatever VS the runner ships -- the
      # windows-latest image moves VS versions over time). Single-config Ninja
      # puts the DLL + import library directly in build_c/.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build resolve_c (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S src/core -B build_c -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PYTHON=OFF -DBUILD_CLI=OFF -DBUILD_TESTS=OFF \
            -DBUILD_R_CAPI=ON -DUSE_CUDA=OFF -DRESOLVE_USE_OPENMP=OFF \
            -DTorch_DIR="$LIBTORCH/share/cmake/Torch"
          cmake --build build_c --target resolve_c
          echo "RESOLVE_C_HOME=${{ github.workspace }}/build_c" >> $GITHUB_ENV
          echo "RESOLVE_C_LIB=${{ github.workspace }}/build_c/resolve_c.lib" >> $GITHUB_ENV

      # ---- loader path so the freshly built resolve.so/.dll finds its deps -
      - name: Configure loader path (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: echo "LD_LIBRARY_PATH=${{ github.workspace }}/build_c:${{ github.workspace }}/libtorch/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Configure loader path (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "DYLD_LIBRARY_PATH=${{ github.workspace }}/build_c:${{ github.workspace }}/libtorch/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "DYLD_FALLBACK_LIBRARY_PATH=${{ github.workspace }}/build_c:${{ github.workspace }}/libtorch/lib:$DYLD_FALLBACK_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Configure loader path (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "${{ github.workspace }}/build_c" >> $GITHUB_PATH

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: |
            any::rcmdcheck
            any::testthat

      - name: Check R package
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual")'
          error-on: '"error"'
          check-dir: '"check"'
