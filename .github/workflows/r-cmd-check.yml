name: R-CMD-check

on:
  push:
    branches: [main, master]
    paths:
      - 'r/**'
      - '.github/workflows/r-cmd-check.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'r/**'
  workflow_dispatch:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}
          - {os: macos-latest, r: 'release'}
          # Windows R CMD check is intentionally not in the matrix.
          # Upstream libtorch only ships an MSVC-built prebuilt for Windows,
          # while R packages on Windows must be compiled with rtools45 (mingw
          # gcc 14.3). The two ABIs are incompatible: mingw gcc rejects the
          # inline `wrap()` definitions in <torch/csrc/jit/ir/ir.h> that are
          # marked TORCH_API (dllimport) with a hard error
          # ("definition is marked dllimport"). This is a libtorch upstream
          # limitation, not a resolve bug. Python bindings use MSVC and work
          # fine on Windows; see .github/workflows/tests.yml.

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Download libtorch (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-2.6.0%2Bcpu.zip
          unzip -q libtorch-cxx11-abi-shared-with-deps-2.6.0+cpu.zip
          echo "LIBTORCH_PATH=${{ github.workspace }}/libtorch" >> $GITHUB_ENV
          # rcmdcheck's "loading the freshly built .so" smoke test runs a
          # fresh R process; -ltorch / -ltorch_cpu / -lc10 are recorded as
          # NEEDED but their absolute path isn't, so the loader needs
          # LD_LIBRARY_PATH to find them. Without this the test errors with
          # "libtorch_cpu.so: cannot open shared object file" even though
          # the .so itself compiled and linked successfully.
          echo "LD_LIBRARY_PATH=${{ github.workspace }}/libtorch/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Download libtorch (macOS)
        if: runner.os == 'macOS'
        run: |
          wget -q https://download.pytorch.org/libtorch/cpu/libtorch-macos-arm64-2.6.0.zip
          unzip -q libtorch-macos-arm64-2.6.0.zip
          echo "LIBTORCH_PATH=${{ github.workspace }}/libtorch" >> $GITHUB_ENV
          # macOS uses DYLD_LIBRARY_PATH (and DYLD_FALLBACK_LIBRARY_PATH).
          # SIP strips DYLD_* from inherited environments when spawning
          # system binaries, but the R session itself launches the dyn.load
          # call inside the same process tree, so the path is honored.
          echo "DYLD_LIBRARY_PATH=${{ github.workspace }}/libtorch/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "DYLD_FALLBACK_LIBRARY_PATH=${{ github.workspace }}/libtorch/lib:$DYLD_FALLBACK_LIBRARY_PATH" >> $GITHUB_ENV

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: |
            any::rcmdcheck
            any::testthat

      - name: Bundle C++ core into R package
        run: |
          # Public headers under include/resolve/ are bundled as a subdir so
          # `#include "resolve/*.hpp"` from .cpp files resolves correctly.
          cp -r src/core/include/resolve r/src/resolve
          # Implementation sources from cpp_src/ are copied flat into r/src/.
          # Both .cpp files and private headers (e.g. fuzzy_internal.h, which
          # is shared by fuzzy_automaton.cpp / fuzzy_index.cpp /
          # fuzzy_search.cpp) must be included; otherwise the build fails
          # with "fuzzy_internal.h: No such file or directory".
          #
          # Headers use the .h extension (not .hpp) because R CMD check
          # --as-cran flags any .hpp file directly under src/ as an
          # "unlikely file name for src files". The header is plain C++ —
          # the extension is purely a CRAN-compatibility convention.
          for f in src/core/cpp_src/*.cpp src/core/cpp_src/*.h; do
            [ -e "$f" ] || continue
            cp "$f" "r/src/$(basename "$f")"
          done

      - name: Check R package
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran", "--no-vignettes")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"error"'
          check-dir: '"check"'
        env:
          LIBTORCH_PATH: ${{ env.LIBTORCH_PATH }}
