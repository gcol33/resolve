name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # C++ tests with Catch2 (+ CLI compile & smoke)
  cpp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libtorch 2.6.0 CPU is the tested floor. The production engine targets a
      # newer torch (2.13+, see src/core/CMakeLists.txt); version-dependent
      # behavior at the production version is not exercised here.
      - name: Install libtorch
        run: |
          wget -q https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-2.6.0%2Bcpu.zip
          unzip -q libtorch-cxx11-abi-shared-with-deps-2.6.0+cpu.zip

      - name: Configure and build (tests + CLI)
        run: |
          cd src/core
          cmake -B build -DBUILD_TESTS=ON -DBUILD_PYTHON=OFF -DBUILD_CLI=ON -DUSE_CUDA=OFF \
                -DTorch_DIR=${{ github.workspace }}/libtorch/share/cmake/Torch
          # ubuntu-latest has 16GB RAM; torch-heavy translation units peak at
          # 3-5GB each, so unbounded -j on a 4-vCPU runner OOM-kills the build.
          cmake --build build --parallel 2

      - name: Run C++ tests
        run: |
          cd src/core/build
          ctest --output-on-failure

      - name: CLI smoke (links + runs)
        run: |
          cd src/core/build
          export LD_LIBRARY_PATH=${{ github.workspace }}/libtorch/lib:$LD_LIBRARY_PATH
          ./bin/resolve version
          ./bin/resolve help

  # Production Python bindings (nanobind _resolve_core). The POC package under
  # src/resolve is legacy; this job exercises the MAINTAINED engine surface that
  # the legacy python-tests job below never touches (it imports the POC).
  resolve-core-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The extension links libtorch via the installed torch package
      # (src/core/python/CMakeLists.txt). CPU torch keeps the build light.
      - name: Install build deps + CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
          pip install "scikit-build-core>=0.4.3" "nanobind>=2.0.0" cmake ninja pandas numpy

      - name: Build & install resolve_core
        run: pip install ./src/core/python --no-build-isolation

      - name: Import smoke
        run: python -c "import resolve_core as rc; print(rc.__version__)"

      - name: Dataset bindings equivalence (from_pandas == from_csv)
        run: python src/core/dev_notes/issue22_from_pandas_smoke.py

  # Legacy POC Python package (src/resolve). Kept only while the POC remains
  # in-tree as a C++ port reference; new work targets resolve_core above.
  python-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov torch

      - name: Run Python tests
        run: |
          pip install -e .
          pytest tests/ -v --tb=short --cov=resolve --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: python
          fail_ci_if_error: false

  # CUDA compile-only check. Manual-dispatch until validated on a CUDA runner:
  # USE_CUDA=ON needs a CUDA-enabled libtorch and the toolkit, so it is not part
  # of the push/PR gate. Catches .cu / cuda_toolchain.cmake / CUDAPrefetcher
  # compile-rot without needing a GPU at runtime.
  cuda-compile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.4.1'
          method: network

      - name: Install CUDA libtorch
        run: |
          wget -q https://download.pytorch.org/libtorch/cu124/libtorch-cxx11-abi-shared-with-deps-2.6.0%2Bcu124.zip -O libtorch-cuda.zip
          unzip -q libtorch-cuda.zip

      - name: Configure and build (compile-only)
        run: |
          cd src/core
          cmake -B build-cuda -DBUILD_TESTS=ON -DBUILD_PYTHON=OFF -DBUILD_CLI=ON -DUSE_CUDA=ON \
                -DTorch_DIR=${{ github.workspace }}/libtorch/share/cmake/Torch
          cmake --build build-cuda --parallel 2
