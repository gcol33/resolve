[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve"
version = "0.5.0"
description = "RESOLVE: Predict outcomes from compositional data via learned representations"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "polars>=1.0",
    "scikit-learn",
]

[project.scripts]
resolve = "resolve.cli:main"

[project.optional-dependencies]
cuda = ["triton"]

[tool.setuptools.packages.find]
where = ["src"]
